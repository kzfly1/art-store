services:
  postgres:
    image: postgres:16-alpine
    container_name: artstore_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: artstore
      POSTGRES_PASSWORD: artstore
      POSTGRES_DB: artstore_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
